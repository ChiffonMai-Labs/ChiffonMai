name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.41.7'
  # 海外 runner 使用官方源；准备阶段仅转换锁文件来源，不升级依赖。
  PUB_HOSTED_URL: 'https://pub.dev'
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
  COCOAPODS_DISABLE_STATS: 'true'

jobs:
  build-ios:
    name: Build unsigned iOS IPA
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: bash

    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 检查构建参数
        env:
          CLIENT_API_KEY: ${{ secrets.CLIENT_API_KEY }}
        run: |
          if [[ -z "${CLIENT_API_KEY//[[:space:]]/}" ]]; then
            echo '::error::请先在仓库 Actions Secrets 中配置 CLIENT_API_KEY。'
            exit 1
          fi

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 准备 iOS 工具链与依赖
        run: |
          xcodebuild -version
          pod --version
          flutter --version
          # 继续使用现有工程的 CocoaPods 集成，不在 CI 隐式迁移到 Swift Package Manager。
          flutter config --no-analytics --no-enable-swift-package-manager
          flutter precache --ios
          python3 .github/scripts/prepare_ci_lockfile.py
          # macOS 上的 pub get 会准备 Podfile 和 xcconfig；构建时由 Flutter 执行 pod install。
          flutter pub get --enforce-lockfile

      - name: 构建未签名归档
        env:
          CLIENT_API_KEY: ${{ secrets.CLIENT_API_KEY }}
        run: |
          flutter build ipa \
            --release \
            --no-codesign \
            --no-pub \
            --obfuscate \
            --split-debug-info=./symbols/ios/ \
            --dart-define="CLIENT_API_KEY=${CLIENT_API_KEY}"

      - name: 组装并校验 IPA
        run: |
          app_path='build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app'
          if [[ ! -d "$app_path" || ! -f "$app_path/Info.plist" ]]; then
            echo '::error::未找到完整的 Runner.app 归档，停止打包。'
            exit 1
          fi
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_path/Info.plist")
          test -x "$app_path/$executable"
          test -s symbols/ios/app.ios-arm64.symbols

          staging_dir=$(mktemp -d "$RUNNER_TEMP/chiffonmai-ipa.XXXXXX")
          mkdir -p "$staging_dir/Payload" build/ios/ipa
          # ditto 保留 App 的框架、符号链接和可执行权限。
          ditto "$app_path" "$staging_dir/Payload/Runner.app"
          ipa_path="$GITHUB_WORKSPACE/build/ios/ipa/ChiffonMai-unsigned.ipa"
          (cd "$staging_dir" && /usr/bin/zip -qry "$ipa_path" Payload)
          unzip -tq "$ipa_path"
          (cd build/ios/ipa && shasum -a 256 ChiffonMai-unsigned.ipa > ChiffonMai-unsigned.ipa.sha256)

          # 原生 dSYM 与 Dart 混淆符号一起保留，供这一版 IPA 的崩溃还原使用。
          dsym_path='build/ios/archive/Runner.xcarchive/dSYMs'
          if [[ -d "$dsym_path" ]]; then
            ditto -c -k --sequesterRsrc --keepParent "$dsym_path" symbols/ios/native-dSYMs.zip
          fi
          {
            echo '## iOS 构建产物'
            echo '- IPA：ChiffonMai-unsigned.ipa（未签名，需要自行签名后安装）'
            echo '- Dart 混淆符号和原生 dSYM：单独的 iOS-symbols Artifact，请下载留存。'
            echo "- 源码提交：${GITHUB_SHA}"
            echo '- Flutter：3.41.7；Xcode：16.4'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传 IPA
        uses: actions/upload-artifact@v7
        with:
          name: ChiffonMai-iOS-unsigned-${{ github.run_number }}
          path: |
            build/ios/ipa/ChiffonMai-unsigned.ipa
            build/ios/ipa/ChiffonMai-unsigned.ipa.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: 上传调试符号
        if: ${{ !cancelled() && hashFiles('symbols/ios/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: ChiffonMai-iOS-symbols-${{ github.run_number }}
          path: symbols/ios/
          if-no-files-found: error
          retention-days: 90
