<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>鹈鹕骑自行车 · SVG 2D 动画</title>
  <style>
    :root {
      --ink: #17324d;
      --sky-top: #8fd7f4;
      --sky-bottom: #e8f8ff;
      --sand: #f6d08d;
      --road: #253c4d;
      --accent: #ff8a5b;
      --paper: rgba(255,255,255,.78);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--ink);
      font-family: "Trebuchet MS", "Microsoft YaHei", system-ui, sans-serif;
      background:
        radial-gradient(circle at 18% 20%, rgba(255,255,255,.52) 0 2px, transparent 3px),
        linear-gradient(155deg, #fff8e9 0%, #dff5fb 52%, #a8dbec 100%);
    }

    .scene-card {
      width: min(1120px, 100%);
      padding: 18px 18px 14px;
      border: 1px solid rgba(23,50,77,.12);
      border-radius: 28px;
      background: rgba(255,255,255,.56);
      box-shadow: 0 22px 70px rgba(43,81,99,.2);
      backdrop-filter: blur(12px);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 14px;
      padding: 0 8px 14px;
    }
    h1 {
      margin: 0 auto 0 0;
      font-size: clamp(18px, 2.5vw, 27px);
      letter-spacing: .04em;
    }
    .toolbar button, .toolbar label {
      font: inherit;
      color: var(--ink);
      background: var(--paper);
      border: 1px solid rgba(23,50,77,.16);
      border-radius: 999px;
      padding: 8px 13px;
    }
    .toolbar button { cursor: pointer; transition: transform .18s ease, background .18s ease; }
    .toolbar button:hover { transform: translateY(-1px); background: #fff; }
    .toolbar input { accent-color: var(--accent); vertical-align: middle; }

    .viewport {
      position: relative;
      overflow: hidden;
      border-radius: 20px;
      background: #b9e7f4;
      aspect-ratio: 16 / 9;
      min-height: 360px;
    }
    svg { display: block; width: 100%; height: 100%; }

    .hint {
      margin: 11px 8px 0;
      font-size: 12px;
      opacity: .68;
      text-align: right;
    }

    /* 动画节奏由 --speed 统一控制，按钮只修改这个变量。 */
    .animated { animation-duration: calc(1s / var(--speed, 1)); animation-play-state: running; }
    .paused .animated { animation-play-state: paused; }

    .cloud-drift { animation: drift 24s linear infinite; }
    .cloud-drift.slow { animation-duration: 34s; animation-delay: -12s; }
    .wheel-spin { transform-box: fill-box; transform-origin: center; animation: spin 1.15s linear infinite; }
    .pedal-spin { transform-box: fill-box; transform-origin: center; animation: spin 1.15s linear infinite reverse; }
    .pelican-bob { transform-box: fill-box; transform-origin: center bottom; animation: bob 1.15s ease-in-out infinite; }
    .wing-flap { transform-box: fill-box; transform-origin: 75% 82%; animation: flap 1.15s ease-in-out infinite; }
    .beak-talk { transform-box: fill-box; transform-origin: 12% 38%; animation: beak 2.8s ease-in-out infinite; }
    .dust { animation: dust 1.4s ease-out infinite; }
    .dust.d2 { animation-delay: .45s; }
    .dust.d3 { animation-delay: .9s; }
    .sun-glow { animation: glow 3.5s ease-in-out infinite; }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @keyframes flap { 0%,100% { transform: rotate(5deg); } 50% { transform: rotate(-13deg); } }
    @keyframes beak { 0%, 84%,100% { transform: rotate(0); } 89%, 94% { transform: rotate(7deg); } }
    @keyframes drift { from { transform: translateX(-18%); } to { transform: translateX(118%); } }
    @keyframes dust { 0% { opacity: 0; transform: translate(0,0) scale(.4); } 25% { opacity: .65; } 100% { opacity: 0; transform: translate(-30px,-20px) scale(1.5); } }
    @keyframes glow { 0%,100% { opacity: .42; transform: scale(1); } 50% { opacity: .72; transform: scale(1.08); } }
  </style>
</head>
<body>
  <main class="scene-card">
    <div class="toolbar">
      <h1>鹈鹕的海风单车之旅</h1>
      <button id="toggle" type="button">暂停动画</button>
      <label>速度 <input id="speed" type="range" min="0.5" max="1.8" step="0.1" value="1" /></label>
    </div>

    <div id="viewport" class="viewport" aria-label="一只鹈鹕骑着自行车沿海边前进的 SVG 动画">
      <svg viewBox="0 0 1200 675" role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg">
        <title id="title">鹈鹕骑自行车</title>
        <desc id="desc">一只戴着小帽子的鹈鹕骑着红色自行车，沿着海边道路前进。</desc>
        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#82d3f2" />
            <stop offset="1" stop-color="#e9faff" />
          </linearGradient>
          <linearGradient id="sea" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#74c8d7" />
            <stop offset="1" stop-color="#c5eef0" />
          </linearGradient>
          <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#405e70" />
            <stop offset="1" stop-color="#1f3547" />
          </linearGradient>
          <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="8" />
          </filter>
          <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="3" />
          </filter>
        </defs>

        <rect width="1200" height="675" fill="url(#sky)" />
        <g class="sun-glow animated" transform="translate(100 93)">
          <circle r="68" fill="#ffd86b" opacity=".24" />
          <circle r="44" fill="#ffe28a" />
          <g stroke="#ffe28a" stroke-width="7" stroke-linecap="round" opacity=".7">
            <path d="M0-69v-19M0 69v19M-69 0h-19M69 0h19M-49-49l-14-14M49 49l14 14M49-49l14-14M-49 49l-14 14" />
          </g>
        </g>

        <g class="cloud-drift slow animated" fill="#fff" opacity=".78">
          <path d="M76 154c15-26 55-28 73-4 9-35 68-42 83 1 41-10 72 14 72 43H53c0-20 6-33 23-40Z" />
        </g>
        <g class="cloud-drift animated" fill="#fff" opacity=".65">
          <path d="M680 108c18-33 67-34 89-4 12-43 86-51 104 3 51-11 88 18 88 52H649c0-23 10-39 31-51Z" />
        </g>

        <path d="M0 352 Q180 315 350 347 T700 340 T1200 344 V504 H0Z" fill="url(#sea)" />
        <g fill="none" stroke="#e9ffff" stroke-width="5" opacity=".7">
          <path d="M28 394c73-24 138 27 211 0s141-22 211 3 143 21 217-3 137-21 214 2 138 22 270-2" />
          <path d="M-20 441c76-24 148 23 220 0s140-20 213 3 150 20 225-3 142-21 217 1 152 23 369-2" />
        </g>
        <path d="M0 478 Q200 444 390 481 T790 472 T1200 476 V529 H0Z" fill="#f2cf8d" />
        <g fill="#6ba889" opacity=".82">
          <path d="M55 481l10-50 8 50 16-42-5 44 26-29-15 32Z" />
          <path d="M1035 480l13-52 7 51 20-39-9 41 27-31-15 33Z" />
          <path d="M890 485l10-44 8 44 17-33-8 35 23-22-13 25Z" />
        </g>

        <path d="M0 518 Q290 482 590 515 T1200 504 V675 H0Z" fill="url(#road)" />
        <path d="M0 545 Q280 511 590 542 T1200 530" fill="none" stroke="#6d8790" stroke-width="5" opacity=".7" />
        <g fill="#f4d67b" opacity=".9">
          <path d="M48 593h112v13H48zM268 579h152v14H268zM564 592h130v13H564zM824 574h156v14H824zM1092 588h90v13h-90z" />
        </g>

        <ellipse cx="610" cy="585" rx="205" ry="26" fill="#0e2534" opacity=".3" filter="url(#softShadow)" />
        <g class="dust animated" fill="#ead7a4">
          <circle cx="346" cy="574" r="7" /><circle cx="324" cy="580" r="4" /><circle cx="300" cy="570" r="5" />
        </g>
        <g class="dust d2 animated" fill="#ead7a4">
          <circle cx="334" cy="584" r="5" /><circle cx="305" cy="591" r="3" />
        </g>
        <g class="dust d3 animated" fill="#ead7a4">
          <circle cx="373" cy="576" r="4" /><circle cx="352" cy="590" r="3" />
        </g>

        <!-- 自行车 -->
        <g transform="translate(0 4)">
          <g fill="none" stroke="#172f40" stroke-width="9">
            <circle cx="405" cy="541" r="72" />
            <circle cx="756" cy="541" r="72" />
          </g>
          <g class="wheel-spin animated" fill="none" stroke="#b9d3d9" stroke-width="3">
            <circle cx="405" cy="541" r="62" />
            <path d="M405 479v124M343 541h124M361 497l88 88M449 497l-88 88" />
          </g>
          <g class="wheel-spin animated" fill="none" stroke="#b9d3d9" stroke-width="3">
            <circle cx="756" cy="541" r="62" />
            <path d="M756 479v124M694 541h124M712 497l88 88M800 497l-88 88" />
          </g>
          <g fill="none" stroke="#ec5f53" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
            <path d="M405 541l131-119 78 119H405l53-119h78" />
            <path d="M614 541l42-126 100 126" />
            <path d="M656 415l22-44" />
            <path d="M661 370h47" />
          </g>
          <path d="M500 421h-53" fill="none" stroke="#172f40" stroke-width="10" stroke-linecap="round" />
          <g class="pedal-spin animated" fill="none" stroke="#172f40" stroke-width="6">
            <circle cx="536" cy="541" r="16" />
            <path d="M536 541l32-26M536 541l-32 26" />
            <path d="M565 512h24M475 567h-24" stroke-linecap="round" stroke-width="8" />
          </g>
        </g>

        <!-- 鹈鹕 -->
        <g class="pelican-bob animated" transform="translate(0 -8)">
          <path d="M532 387c-13-53 13-94 65-111 63-21 137 8 153 65 14 51-15 92-76 103-63 11-128-8-142-57Z" fill="#f6f2e8" stroke="#17324d" stroke-width="7" />
          <path d="M545 337c31-33 71-40 123-21 38 14 55 41 45 66-15 37-73 51-122 32-37-14-61-44-46-77Z" fill="#e0e7e1" opacity=".9" />
          <path class="wing-flap animated" d="M586 366c19-48 68-61 113-34 26 15 41 38 40 60-28 25-77 34-121 15-19-8-29-22-32-41Z" fill="#fffaf0" stroke="#17324d" stroke-width="6" />
          <path d="M612 401c17 16 37 26 61 31" fill="none" stroke="#b9c8c5" stroke-width="7" stroke-linecap="round" />
          <path d="M583 434l-5 87M647 432l20 84" fill="none" stroke="#ea734d" stroke-width="13" stroke-linecap="round" />
          <g fill="none" stroke="#ea734d" stroke-width="11" stroke-linecap="round">
            <path d="M578 515l-30 18M664 516l29 15" />
          </g>
          <path d="M597 295c-16-45 17-75 51-77 38-2 70 23 70 66-27-13-73-10-121 11Z" fill="#ff8b5c" stroke="#17324d" stroke-width="7" />
          <path d="M614 281c15-21 46-30 76-21" fill="none" stroke="#ffd86b" stroke-width="12" stroke-linecap="round" />
          <path d="M634 307c-8-42 15-71 48-76 17-3 31 2 43 10-12 18-17 42-13 67Z" fill="#fff7e5" opacity=".9" />
          <circle cx="682" cy="313" r="8" fill="#17324d" />
          <circle cx="685" cy="310" r="2.5" fill="#fff" />
          <path class="beak-talk animated" d="M697 324c60-8 113 1 134 23-19 25-65 36-128 26-15-3-22-11-22-23 0-12 6-22 16-26Z" fill="#f58a62" stroke="#17324d" stroke-width="7" />
          <path d="M708 349c35 5 75 3 106-7" fill="none" stroke="#bc5546" stroke-width="4" stroke-linecap="round" />
          <circle cx="751" cy="360" r="5" fill="#bc5546" />
          <path d="M724 373c15 9 33 9 51 4" fill="none" stroke="#17324d" stroke-width="4" stroke-linecap="round" />
        </g>

        <g transform="translate(1010 620)" fill="#fff" opacity=".78">
          <path d="M0 0c10-17 26-17 34 0 8-15 23-14 30 0 11-7 25-2 27 11H-6C-5 5-3 2 0 0Z" />
        </g>
        <text x="34" y="642" fill="#e7f8fb" font-size="15" opacity=".8">海风、车轮，还有一点点好心情</text>
      </svg>
    </div>
    <p class="hint">SVG + CSS keyframes · 拖动速度滑块，看看鹈鹕能不能赶上海风</p>
  </main>

  <script>
    const viewport = document.getElementById('viewport');
    const toggle = document.getElementById('toggle');
    const speed = document.getElementById('speed');

    toggle.addEventListener('click', () => {
      const paused = viewport.classList.toggle('paused');
      toggle.textContent = paused ? '继续动画' : '暂停动画';
      toggle.setAttribute('aria-pressed', String(paused));
    });

    speed.addEventListener('input', (event) => {
      viewport.style.setProperty('--speed', event.target.value);
    });
  </script>
</body>
</html>
